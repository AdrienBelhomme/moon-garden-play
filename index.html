		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #0f0d14;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<script>
// Keep Godot's backing canvas inside the iPhone notch and home-indicator insets.
// Policy 0 lets this shell own sizing; Godot reads the canvas dimensions each frame.
(() => {
 const surface = document.getElementById('game-surface');
 const canvas = document.getElementById('canvas');
 const buttons = [...document.querySelectorAll('.fullscreen-button')];
 function resizeCanvas() {
  const rect = surface.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  const width = Math.max(1, Math.round(rect.width * ratio));
  const height = Math.max(1, Math.round(rect.height * ratio));
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  if (canvas.width !== width) canvas.width = width;
  if (canvas.height !== height) canvas.height = height;
 }
 function updateFullscreenButtons() {
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const available = navigator.maxTouchPoints > 0 && document.fullscreenEnabled && !standalone && !document.fullscreenElement;
  buttons.forEach(button => { button.hidden = !available; });
 }
 async function enterFullscreen() {
  try {
   if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
   if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
  } catch (_) {
   // iOS and some browsers require the player to rotate the phone manually.
  }
  updateFullscreenButtons();
  canvas.focus();
 }
 buttons.forEach(button => button.addEventListener('click', enterFullscreen));
 document.addEventListener('fullscreenchange', () => { resizeCanvas(); updateFullscreenButtons(); });
 window.addEventListener('resize', resizeCanvas);
 if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeCanvas);
 new ResizeObserver(resizeCanvas).observe(surface);
 resizeCanvas();
 updateFullscreenButtons();
})();

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":74574916,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function prepareOfflineCache() {
		if (!GODOT_CONFIG.serviceWorker || !('serviceWorker' in navigator)) {
			return Promise.resolve();
		}
		const register = () => Promise.resolve().then(() =>
			navigator.serviceWorker.register(GODOT_CONFIG.serviceWorker));
		if (navigator.serviceWorker.controller) {
			register().catch(() => {}); // Check for updates without delaying play.
			return Promise.resolve();
		}
		// Godot normally registers after loading the PCK/WASM, too late to cache
		// them on the first visit. Wait for control before starting those requests.
		// Denied storage or a slow install must still allow the online game to run.
		return new Promise(resolve => {
			const finish = () => {
				clearTimeout(timeout);
				navigator.serviceWorker.removeEventListener('controllerchange', onControl);
				resolve();
			};
			const onControl = () => {
				if (navigator.serviceWorker.controller) finish();
			};
			const timeout = setTimeout(finish, 5000);
			navigator.serviceWorker.addEventListener('controllerchange', onControl);
			register().then(onControl).catch(finish);
		});
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		prepareOfflineCache().then(() => engine.startGame({
			// Registration and its failure handling belong to the shell above.
			'serviceWorker': '',
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		})).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
